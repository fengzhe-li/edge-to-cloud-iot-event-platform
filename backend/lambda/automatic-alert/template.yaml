# associated with these triggers aren't fully specified in this template and
# include placeholder values. Open this template in AWS Infrastructure Composer
# or your favorite IDE and modify it to specify a serverless application with
# other AWS resources.
#
# - SAM automatically generates permissions to interact with the resources
#   defined in this template. If your function needs additional permissions, add
#   Policies to the AWS::Serverless::Function resource.
# - [Trigger1]: Fill in an SQL statement for the IoT rule defined in your
#   specification file.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../../layers/common
      CompatibleRuntimes: [python3.12]
  AlertNotificationServiceauto:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: .
      Description: ''
      Environment:
        Variables:
          SES_FROM_EMAIL: sender@example.com
      EphemeralStorage:
        Size: 512
      Layers: [!Ref CommonLayer]
      Handler: lambda_function.lambda_handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/AlertNotificationServiceauto
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: python3.12
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 3
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: IoTRule
          Properties:
            Sql: SELECT * FROM 'waterlevel/sensors/+/state'
