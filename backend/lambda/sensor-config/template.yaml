# This AWS SAM template has been generated from your function's configuration.
# If your function has one or more triggers, note that the AWS resources
# associated with these triggers aren't fully specified in this template and
# include placeholder values. Open this template in AWS Infrastructure Composer
# or your favorite IDE and modify it to specify a serverless application with
# other AWS resources.
#
# - SAM automatically generates permissions to interact with the resources
#   defined in this template. If your function needs additional permissions, add
#   Policies to the AWS::Serverless::Function resource.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../../layers/common
      CompatibleRuntimes: [python3.12]
  PushSensorConfig:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: .
      Description: ''
      Environment:
        Variables:
          IOT_ENDPOINT: example-ats.iot.eu-north-1.amazonaws.com
          DB_PASS: CHANGE_ME_VIA_SECRETS_MANAGER
          DB_PORT: '5432'
          DB_USER: iot
          DB_NAME: postgres
          DB_HOST: example-db.cluster-xxxxxxxx.eu-north-1.rds.amazonaws.com
          DETAIL_TYPE: SpillStatusChanged
      EphemeralStorage:
        Size: 512
      Handler: lambda_function.lambda_handler
      Layers:
        - !Ref CommonLayer
        - arn:aws:lambda:eu-north-1:123456789012:layer:psycopg2_layer_312:1
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/PushSensorConfig
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: python3.12
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 3
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: Api
          Properties:
            Method: GET
            Path: /config/{device_id}
        Trigger2Event:
          Type: Api
          Properties:
            Method: POST
            Path: /config/{device_id}/update
        Trigger3Event:
          Type: Api
          Properties:
            Method: POST
            Path: /config/push
        Trigger4Event:
          Type: Api
          Properties:
            Method: GET
            Path: /threshold/{device_id}
        Trigger5Event:
          Type: Api
          Properties:
            Method: POST
            Path: /threshold/{device_id}/update
        Trigger6Event:
          Type: Api
          Properties:
            Method: POST
            Path: /threshold/push
