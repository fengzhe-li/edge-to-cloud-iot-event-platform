name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spill_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AWS_DEFAULT_REGION: eu-north-1
      AWS_EC2_METADATA_DISABLED: "true"
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/spill_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m compileall -q backend scripts tests
      - run: ruff check backend scripts tests
      - run: python scripts/validate_config.py
      - run: cfn-lint template.yaml
      - run: python scripts/check_secrets.py
      - run: node --check frontend/analytics.js
      - run: pytest -q
