<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc">
<title id="title">AWS IoT Operational Analytics architecture</title><desc id="desc">MQTT devices feed IoT Core and Python Lambda. PostgreSQL holds history and current state. Analytics and REST endpoints serve a dashboard through deployment-provided authorization. DynamoDB and SES support conditional alert attempts.</desc>
