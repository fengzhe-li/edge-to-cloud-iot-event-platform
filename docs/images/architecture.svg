<path d="M48 608 H1232" stroke="#314253"/>
<text x="48" y="646" font-size="17" fill="#edf4fc">Tested locally: Python logic + PostgreSQL transactions + DynamoDB emulation</text>
<text x="48" y="678" font-size="15" fill="#b1becf">No invented availability or response times. No throughput, exactly-once delivery or live-deployment claims.</text>
